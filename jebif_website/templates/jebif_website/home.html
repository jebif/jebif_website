{% extends 'jebif_website/base.html' %}
{% load html_tags %}

{% block content %}

            {% for article in articles %}

                {% if article %}
                        <a href="{%url 'article' slug=article.slug %}" class="text-decoration-none" style="color: #436d8f;"><h2>{{article.title}}</h2></a>
                        <div>{{ article.content|sanitize_html|truncatewords_html:100 }}</div>
                        <hr class="my-4"> 
                {% endif %}

            {% endfor %}

            {% include 'jebif_website/pagination.html' %}

{% endblock %}
